services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metavault
      POSTGRES_USER: metavault
      POSTGRES_PASSWORD: ${METAVAULT_DB_PASSWORD:-metavault-local}
    ports:
      - "5432:5432"
    volumes:
      - metavault-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metavault -d metavault"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    platform: linux/amd64
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      METAVAULT_DATABASE_URL: postgresql+psycopg://metavault:${METAVAULT_DB_PASSWORD:-metavault-local}@postgres:5432/metavault
      METAVAULT_SECRET_KEY: ${METAVAULT_SECRET_KEY:-change-this-before-production}
      METAVAULT_ADMIN_EMAIL: ${METAVAULT_ADMIN_EMAIL:-admin@example.com}
      METAVAULT_ADMIN_PASSWORD: ${METAVAULT_ADMIN_PASSWORD:-Admin123!}
      METAVAULT_CORS_ORIGINS: http://localhost:8090
      METAVAULT_DEPLOYMENT_MODE: docker
      METAVAULT_COLLECTION_WORKERS: ${METAVAULT_COLLECTION_WORKERS:-8}
    volumes:
      - ./sample:/app/sample:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8090:80"
volumes:
  metavault-postgres-data:
