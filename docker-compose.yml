services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metavault
      POSTGRES_USER: metavault
      POSTGRES_PASSWORD: "${METAVAULT_DB_PASSWORD:?METAVAULT_DB_PASSWORD must be set}"
    ports:
      - "5432:5432"
    volumes:
      - metavault-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metavault -d metavault"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    platform: linux/amd64
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      METAVAULT_DATABASE_HOST: "${METAVAULT_DATABASE_HOST:-postgres}"
      METAVAULT_DATABASE_PORT: "${METAVAULT_DATABASE_PORT:-5432}"
      METAVAULT_DATABASE_NAME: "${METAVAULT_DATABASE_NAME:-metavault}"
      METAVAULT_DATABASE_USER: "${METAVAULT_DATABASE_USER:-metavault}"
      METAVAULT_DATABASE_PASSWORD: "${METAVAULT_DB_PASSWORD:?METAVAULT_DB_PASSWORD must be set}"
      METAVAULT_SECRET_KEY: "${METAVAULT_SECRET_KEY:?METAVAULT_SECRET_KEY must be set}"
      METAVAULT_ADMIN_EMAIL: ${METAVAULT_ADMIN_EMAIL:-admin@example.com}
      METAVAULT_ADMIN_PASSWORD: "${METAVAULT_ADMIN_PASSWORD:?METAVAULT_ADMIN_PASSWORD must be set}"
      METAVAULT_CORS_ORIGINS: http://localhost:8090
      METAVAULT_DEPLOYMENT_MODE: docker
      METAVAULT_COLLECTION_WORKERS: ${METAVAULT_COLLECTION_WORKERS:-8}
      METAVAULT_DATALAKE_ROOT: /var/lib/metavault/datalake
    volumes:
      - ./sample:/app/sample:ro
      - ./datalake:/var/lib/metavault/datalake
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    platform: linux/amd64
    build: ./backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      METAVAULT_DATABASE_HOST: "${METAVAULT_DATABASE_HOST:-postgres}"
      METAVAULT_DATABASE_PORT: "${METAVAULT_DATABASE_PORT:-5432}"
      METAVAULT_DATABASE_NAME: "${METAVAULT_DATABASE_NAME:-metavault}"
      METAVAULT_DATABASE_USER: "${METAVAULT_DATABASE_USER:-metavault}"
      METAVAULT_DATABASE_PASSWORD: "${METAVAULT_DB_PASSWORD:?METAVAULT_DB_PASSWORD must be set}"
      METAVAULT_SECRET_KEY: "${METAVAULT_SECRET_KEY:?METAVAULT_SECRET_KEY must be set}"
      METAVAULT_ADMIN_EMAIL: ${METAVAULT_ADMIN_EMAIL:-admin@example.com}
      METAVAULT_ADMIN_PASSWORD: "${METAVAULT_ADMIN_PASSWORD:?METAVAULT_ADMIN_PASSWORD must be set}"
      METAVAULT_CORS_ORIGINS: http://localhost:8090
      METAVAULT_DEPLOYMENT_MODE: docker
      METAVAULT_COLLECTION_WORKERS: ${METAVAULT_COLLECTION_WORKERS:-8}
      METAVAULT_WORKER_STALE_MINUTES: ${METAVAULT_WORKER_STALE_MINUTES:-15}
      METAVAULT_WORKER_POLL_SECONDS: ${METAVAULT_WORKER_POLL_SECONDS:-5}
      METAVAULT_RETRY_BASE_SECONDS: ${METAVAULT_RETRY_BASE_SECONDS:-10}
      METAVAULT_DATALAKE_ROOT: /var/lib/metavault/datalake
    volumes:
      - ./sample:/app/sample:ro
      - ./datalake:/var/lib/metavault/datalake
  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8090:80"
volumes:
  metavault-postgres-data:
